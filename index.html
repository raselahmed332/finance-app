<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b3a2c">
  <meta name="color-scheme" content="light dark">
  <title>মাই পার্সোনাল হিসাব - Personal Finance Web App</title>

  <style>
    html,
    body {
      margin: 0;
      background-color: #f1f5f3;
    }

    .dark html,
    .dark body {
      background-color: #080e0c;
    }
  </style>

  <!-- Applied before the first paint so the app never flashes the wrong theme. -->
  <script>
    (function () {
      try {
        var mode = localStorage.getItem("hisab_theme");
        if (mode !== "light" && mode !== "dark" && mode !== "system") {
          var legacy = localStorage.getItem("hisab_dark");
          mode = legacy === null ? "system" : (legacy === "true" ? "dark" : "light");
        }
        var dark =
          mode === "dark" ||
          (mode === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#0a2a21" : "#0b3a2c");
      } catch (e) {
        /* storage blocked - the app still renders, just with the default theme */
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
