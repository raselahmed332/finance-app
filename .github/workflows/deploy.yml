name: Deploy frontend to GitHub Pages

# Auto-deploys the React frontend on every push to main, matching the workflow
# described in the project README. Only the frontend is deployed; the Google
# Apps Script backend is deployed by hand from the Apps Script editor.
#
# NOTE: this file lives at the frontend project root. If you keep the frontend
# inside a monorepo instead of publishing the "finance-app" folder as its own
# repository, move this file to the monorepo root and add
#   defaults: { run: { working-directory: finance-app } }
# plus `path: finance-app/dist` in the upload step.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
