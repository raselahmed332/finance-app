<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Amar Hisab header wallet mark adapted for Android icon and splash screen</title>
  <desc id="desc">The simple wallet outline with a small gold clasp from the header concept, adapted to an Android app icon and matching splash screen.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f7f4"/>
      <stop offset="1" stop-color="#e8f0ed"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d8b7f"/>
      <stop offset="1" stop-color="#12665f"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#193b37" flood-opacity=".15"/>
    </filter>
  </defs>

  <rect width="1200" height="760" rx="36" fill="url(#canvas)"/>
  <text x="600" y="79" text-anchor="middle" fill="#263d39" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="3">HEADER MARK · APP ICON + SPLASH</text>
  <text x="300" y="148" text-anchor="middle" fill="#657873" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">ANDROID APP ICON</text>
  <text x="830" y="148" text-anchor="middle" fill="#657873" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">SPLASH SCREEN</text>

  <g filter="url(#shadow)">
    <rect x="100" y="191" width="400" height="400" rx="88" fill="url(#teal)"/>
  </g>
  <g transform="translate(0 0)" stroke="#fbfaf5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M188 306a34 34 0 0 1 34-34h157a27 27 0 0 1 27 27v21h-47a58 58 0 0 0 0 116h47v21a34 34 0 0 1-34 34H222a34 34 0 0 1-34-34z" fill="none" stroke-width="17"/>
    <path d="M360 321h55a22 22 0 0 1 22 22v61a22 22 0 0 1-22 22h-55a52 52 0 0 1 0-105z" fill="#fbfaf5" fill-opacity=".13" stroke-width="14"/>
    <circle cx="370" cy="374" r="10" fill="#efc66f" stroke="none"/>
  </g>
  <text x="300" y="640" text-anchor="middle" fill="#263d39" font-family="Arial, sans-serif" font-size="18">Same wallet outline · small gold clasp</text>

  <g filter="url(#shadow)">
    <rect x="600" y="177" width="460" height="455" rx="38" fill="#fbfaf5"/>
    <rect x="600" y="177" width="460" height="455" rx="38" fill="none" stroke="#dce7e2" stroke-width="2"/>
  </g>
  <rect x="758" y="232" width="144" height="144" rx="42" fill="url(#teal)"/>
  <g stroke="#fbfaf5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M789 272a13 13 0 0 1 13-13h60a10 10 0 0 1 10 10v9h-18a23 23 0 0 0 0 46h18v9a13 13 0 0 1-13 13h-57a13 13 0 0 1-13-13z" fill="none" stroke-width="6"/>
    <path d="M855 278h21a9 9 0 0 1 9 9v25a9 9 0 0 1-9 9h-21a22 22 0 0 1 0-43z" fill="#fbfaf5" fill-opacity=".13" stroke-width="5"/>
    <circle cx="859" cy="299" r="4" fill="#efc66f" stroke="none"/>
  </g>
  <text x="830" y="454" text-anchor="middle" fill="#203b36" font-family="Arial, sans-serif" font-size="37" font-weight="700">আমার হিসাব</text>
  <text x="830" y="494" text-anchor="middle" fill="#6a7e79" font-family="Arial, sans-serif" font-size="16">মাই পার্সোনাল হিসাব</text>
  <rect x="786" y="534" width="88" height="4" rx="2" fill="#168278" opacity=".5"/>

  <text x="600" y="706" text-anchor="middle" fill="#61736e" font-family="Arial, sans-serif" font-size="16">The header’s recognizable wallet mark carried across Android surfaces</text>
</svg>
